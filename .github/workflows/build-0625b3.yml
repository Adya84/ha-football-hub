name: Build safe LMS 0.6.25b3

on:
  push:
    branches: [fix-lms-0625b3]
    paths:
      - .github/workflows/build-0625b3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-lms-0625b3
          fetch-depth: 0

      - name: Apply byte-safe patches
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('custom_components/football_hub')
          panel_path = root / 'frontend' / 'football-hub-panel.js'
          entry_path = root / 'frontend' / 'football-hub-panel-entry.js'
          sensor_path = root / 'sensors' / 'sensor.py'
          init_path = root / '__init__.py'
          manifest_path = root / 'manifest.json'

          original_entry = entry_path.read_bytes()
          panel = panel_path.read_bytes()
          nl = b'\r\n' if b'\r\n' in panel else b'\n'

          old = b'if (this._activeTab !== "last-man-standing" || !competition?.shareId || !LMS_SHARE_SERVICE || this._lmsShareBusy || this._lmsShareSyncPending) return;'
          new = b'if (!competition?.shareId || !LMS_SHARE_SERVICE || this._lmsShareBusy || this._lmsShareSyncPending) return;'
          if panel.count(old) != 1:
              raise SystemExit('Expected _pullLmsSharePicks guard not found exactly once')
          panel = panel.replace(old, new, 1)

          start = panel.find(b'  async _maybeAutoSettleLmsRound() {')
          end = panel.find(b'  async _settleLmsRound(automatic = false) {', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate LMS auto-settle function boundaries')

          lines = [
            '  async _maybeAutoSettleLmsRound() {',
            '    const competition = this._lmsCompetition;',
            '    if (!competition || competition.completed || this._lmsAutoCheckBusy || !this._lmsDeadlineState().locked) return;',
            '    this._lmsAutoCheckBusy = true;',
            '    try {',
            '      await this._pullLmsSharePicks(true);',
            '',
            '      const finished = new Set(["FT", "AET", "PEN", "AWD", "WO"]);',
            '      const roundKey = String(competition.round);',
            '      const roundStarted = Number(competition.roundStarted || 0);',
            '      const activePlayers = (competition.players || []).filter((player) => player.alive);',
            '',
            '      const evaluate = () => {',
            '        const fixtures = this._lmsRoundFixtureGroups().flatMap((league) => league.roundFixtures || []);',
            '        const matchForPick = (pick) => fixtures',
            '          .filter((fixture) =>',
            '            (fixture.home_team === pick || fixture.away_team === pick) &&',
            '            this._lmsFixtureTimestamp(fixture) >= roundStarted - 86400',
            '          )',
            '          .sort((a, b) => this._lmsFixtureTimestamp(a) - this._lmsFixtureTimestamp(b))[0];',
            '',
            '        const allPickedTeamsFinished = activePlayers.length > 0 && activePlayers.every((player) => {',
            '          const pick = player.picks?.[roundKey];',
            '          if (!pick) return true;',
            '          const match = matchForPick(pick);',
            '          return Boolean(match && finished.has(String(match.status_short || match.status || "").toUpperCase()));',
            '        });',
            '',
            '        const hasFinishedUnresolved = activePlayers.some((player) => {',
            '          if (player.results?.[roundKey]) return false;',
            '          const pick = player.picks?.[roundKey];',
            '          if (!pick) return true;',
            '          const match = matchForPick(pick);',
            '          return Boolean(match && finished.has(String(match.status_short || match.status || "").toUpperCase()));',
            '        });',
            '',
            '        return { fixtures, allPickedTeamsFinished, hasFinishedUnresolved };',
            '      };',
            '',
            '      // First use the LMS cache already refreshed from Home Assistant live/results data.',
            '      let state = evaluate();',
            '',
            '      // Only fall back to the LMS fixture endpoint when HA has not yet supplied a final state.',
            '      if (!state.allPickedTeamsFinished && !state.hasFinishedUnresolved) {',
            '        await this._refreshLmsRoundFixtures();',
            '        state = evaluate();',
            '      }',
            '',
            '      if (state.hasFinishedUnresolved || state.allPickedTeamsFinished) {',
            '        await this._settleLmsRound(true);',
            '      }',
            '    } finally {',
            '      this._lmsAutoCheckBusy = false;',
            '    }',
            '  }',
            '',
          ]
          replacement = nl.join(line.encode('utf-8') for line in lines)
          panel = panel[:start] + replacement + panel[end:]

          old_status = b'const finished = ["FT", "AET", "PEN"].includes(String(match?.status_short || match?.status || "").toUpperCase());'
          new_status = b'const finished = ["FT", "AET", "PEN", "AWD", "WO"].includes(String(match?.status_short || match?.status || "").toUpperCase());'
          if panel.count(old_status) != 1:
              raise SystemExit('Expected player-finished status check not found exactly once')
          panel = panel.replace(old_status, new_status, 1)

          block_start = panel.find(b'    const unresolved = competition.players.some((player) => player.alive && player.picks?.[roundKey] && !player.results?.[roundKey]);')
          block_end = panel.find(b'      if (!competition.resultsEmailSent?.[roundKey]) {', block_start)
          if block_start < 0 or block_end < 0:
              raise SystemExit('Could not locate picked-match completion block')

          block_lines = [
            '    const unresolved = competition.players.some((player) => player.alive && player.picks?.[roundKey] && !player.results?.[roundKey]);',
            '    const pickedTeams = new Set(competition.players.map((player) => player.picks?.[roundKey]).filter(Boolean));',
            '    const roundStartedForCheck = Number(competition.roundStarted || 0);',
            '    const selectedPickedFixtures = [...pickedTeams].map((team) => fixtures',
            '      .filter((fixture) =>',
            '        (fixture.home_team === team || fixture.away_team === team) &&',
            '        this._lmsFixtureTimestamp(fixture) >= roundStartedForCheck - 86400',
            '      )',
            '      .sort((a, b) => this._lmsFixtureTimestamp(a) - this._lmsFixtureTimestamp(b))[0]',
            '    ).filter(Boolean);',
            '    const pickedMatchesFinished = pickedTeams.size > 0 && selectedPickedFixtures.length === pickedTeams.size && selectedPickedFixtures.every((fixture) =>',
            '      ["FT", "AET", "PEN", "AWD", "WO"].includes(String(fixture.status_short || fixture.status || "").toUpperCase())',
            '    );',
            '    if (pickedMatchesFinished && !waiting && !unresolved) {',
            '      const survivors = competition.players.filter((player) => player.alive);',
            '      const completedRoundEnds = selectedPickedFixtures.map((fixture) => this._lmsFixtureTimestamp(fixture)).filter(Boolean);',
            '      const nextRoundStartsAfter = completedRoundEnds.length ? Math.max(...completedRoundEnds) + 300 : Math.floor(Date.now() / 1000);',
          ]
          panel = panel[:block_start] + nl.join(line.encode('utf-8') for line in block_lines) + nl + panel[block_end:]
          panel_path.write_bytes(panel)

          if entry_path.read_bytes() != original_entry:
              raise SystemExit('Entry loader changed unexpectedly')

          sensor = sensor_path.read_bytes()
          sensor_nl = b'\r\n' if b'\r\n' in sensor else b'\n'
          marker = b'class FootballHubMatchesTodaySensor(FootballHubBaseSensor):' + sensor_nl
          addition = marker + b'    _unrecorded_attributes = frozenset({"matches"})' + sensor_nl
          if sensor.count(marker) != 1:
              raise SystemExit('Matches Today class marker not found exactly once')
          sensor = sensor.replace(marker, addition, 1)
          sensor_path.write_bytes(sensor)

          init = init_path.read_bytes()
          if init.count(b'PANEL_VERSION = "0.6.24-acca-score-refresh"') != 1:
              raise SystemExit('0.6.24 panel version marker not found')
          init = init.replace(b'PANEL_VERSION = "0.6.24-acca-score-refresh"', b'PANEL_VERSION = "0.6.25b3-lms-live-settlement"', 1)
          init_path.write_bytes(init)

          manifest = manifest_path.read_bytes()
          if manifest.count(b'"version": "0.6.24"') != 1:
              raise SystemExit('0.6.24 manifest version marker not found')
          manifest = manifest.replace(b'"version": "0.6.24"', b'"version": "0.6.25b3"', 1)
          manifest_path.write_bytes(manifest)

          for path in (panel_path, entry_path):
              data = path.read_bytes()
              if data.startswith(b'\xef\xbb\xbf') or b'\x00' in data:
                  raise SystemExit(f'Invalid hidden byte detected in {path}')

      - name: Verify JavaScript and Python
        run: |
          node --check custom_components/football_hub/frontend/football-hub-panel.js
          node --check custom_components/football_hub/frontend/football-hub-panel-entry.js
          python -m py_compile custom_components/football_hub/__init__.py custom_components/football_hub/sensors/sensor.py

      - name: Verify loader is identical to 0.6.24
        run: |
          git show 0.6.24:custom_components/football_hub/frontend/football-hub-panel-entry.js > /tmp/entry-0624.js
          cmp /tmp/entry-0624.js custom_components/football_hub/frontend/football-hub-panel-entry.js

      - name: Commit patched beta
        run: |
          git config user.name "Ady"
          git config user.email "94404576+Adya84@users.noreply.github.com"
          git add custom_components/football_hub/frontend/football-hub-panel.js custom_components/football_hub/sensors/sensor.py custom_components/football_hub/__init__.py custom_components/football_hub/manifest.json
          git diff --cached --check
          git commit -m "Fix LMS live settlement safely for 0.6.25b3"
          git push origin HEAD:fix-lms-0625b3
